<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Mastermind - Dark Theme</title>
    <style>
        /* Define the blink animation */
        /* Define the vibration animation */
        @keyframes vibrate {
            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            50% {
                transform: translateX(5px);
            }

            75% {
                transform: translateX(-5px);
            }

            100% {
                transform: translateX(5px);
            }
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom right, #0d1117, #161b22);
            color: #c9d1d9;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            position: relative;
            padding: 20px;
            box-sizing: border-box;
        }

        .heading {
            font-size: 3.5rem;
            font-weight: bold;
            text-align: center;
            color: #58a6ff;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.8);
            margin-bottom: 10px;
        }

        .subheading {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            color: #c9d1d9;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
            margin-bottom: 30px;
        }



        .join-button {
            background: linear-gradient(to bottom, #238636, #2ea043);
            color: white;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s, box-shadow 0.3s;
            animation: vibrate 0.9s infinite; /* Apply vibration effect */
        }

            .join-button:hover {
                transform: scale(1.1);
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.8);
            }

            .join-button:active {
                transform: scale(0.95);
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            }


        .icons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #21262d;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

            .icon img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

        .background-decor {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('assets/img/crypto_bg1.jpeg') center/cover no-repeat;
            opacity: 0.2;
            z-index: -1;
        }

        .profit-indicator1 {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #8b949e;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .profit-indicator {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #00ff00;
            font-size: 1.2rem;
        }

        .arrow {
            position: absolute;
            top: 20%;
            right: 10%;
            font-size: 3rem;
            color: #00ff00;
            animation: arrow-up 2s infinite;
        }

        @keyframes arrow-up {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @media (max-width: 768px) {
            .heading {
                font-size: 2.5rem;
            }

            .subheading {
                font-size: 1.5rem;
            }

            .join-button {
                padding: 10px 30px;
                font-size: 1.2rem;
            }

            .icon {
                width: 50px;
                height: 50px;
            }

            .profit-indicator {
                font-size: 1rem;
            }

            .arrow {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="background-decor"></div>
    <div class="container">
        <div class="heading">Crypto Mastermind</div>
        <div class="subheading">Maximize Your Crypto Profits!</div>
        <a style="text-decoration: none;" href="https://t.me/+VzrVmIDa3_YwZmY1" class="join-button">Join Now</a>
        <div class="icons">
            <div class="icon"><img src="assets/img/bitcoin.jpg" alt="Bitcoin"></div>
            <div class="icon"><img src="assets/img/ethereum.jpg" alt="Ethereum"></div>
            <div class="icon"><img src="assets/img/dollar.jpg" alt="Dollar"></div>
        </div>
        <div class="profit-indicator1">"Join the Experts Today and See Your Crypto Portfolio Soar!"</div>
        <div class="profit-indicator">Profit: +2500%</div>
        <div class="arrow">⬆</div>
    </div>
</body>
</html>
